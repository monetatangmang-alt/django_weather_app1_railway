<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            margin:0;
            line-height: 1.6;
            font-family: sans-serif; 
        }
        nav {
            background-color: #ffefb3;
            padding: 1rem;
        }

        nav a {
            color: #013e37;
            text-decoration: none;
            font-size: 1.2rem;
            padding:0 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding:0 15px;
        }
        
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            text-align: center;
        }

        .success {
            background-color:rgb(183, 255, 171);
            color: rgb(56, 138, 56);
            border: 1px solid #2aa446;
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #12a4ba;
        }
    </style>

</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'home' %}">Weather App</a>
        </div>
    </nav>

    <div class="container">
        
        {% if messages %}
            
            {% for message in messages %}
                <div class="message {{message.tags}}">
                    {{ message }}
                </div>
            {% endfor %}
                
        {% endif %}
            
        {% block content%}

        {% endblock %}
    </div>
</body>
</html>
